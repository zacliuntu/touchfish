name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    name: Verify and package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package-command: pnpm package:linux
            artifact-name: touchfish-linux
            artifact-path: dist/TouchFish-*.deb
          - name: Windows
            os: windows-latest
            package-command: pnpm package:win
            artifact-name: touchfish-windows
            artifact-path: dist/TouchFish-Setup-*.exe

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb \
            wmctrl \
            x11-xserver-utils \
            x11-utils \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            libatspi2.0-0 \
            libuuid1 \
            libsecret-1-0 \
            libgbm1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source formatting
        run: pnpm format:check

      - name: Lint source
        run: pnpm lint

      - name: Type-check source
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build source
        run: pnpm build

      - name: Check source Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'source-windows-helper.log'
          $checkerOutput = @(
            & pwsh -NoLogo -NoProfile -File scripts/check-windows-helper.ps1 resources/windows/window-helper.ps1 2>&1
          )
          $checkerStatus = $LASTEXITCODE
          $checkerOutput | ForEach-Object { Write-Output $_ }

          $logStatus = 0
          try {
            $checkerOutput |
              ForEach-Object { "$_" } |
              Set-Content -LiteralPath $logPath -Encoding utf8 -ErrorAction Stop
          } catch {
            $logStatus = 1
            Write-Output "Unable to capture the Windows helper log: $_"
          }

          $failureStatus = 0
          if ($checkerStatus -ne 0) {
            $failureStatus = $checkerStatus
          } elseif ($logStatus -ne 0) {
            $failureStatus = $logStatus
          }

          if ($failureStatus -ne 0) {
            $diagnosticLines = @(
              "Windows helper check failed (checker exit $checkerStatus, log capture exit $logStatus). Last 200 log lines:"
              if (Test-Path -LiteralPath $logPath -PathType Leaf -ErrorAction SilentlyContinue) {
                try {
                  Get-Content -LiteralPath $logPath -Tail 200 -ErrorAction Stop
                } catch {
                  'Unable to read the complete Windows helper log.'
                }
              } else {
                'Windows helper log is unavailable.'
              }
            )
            $diagnostic = $diagnosticLines -join "`n"
            $escapedDiagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$escapedDiagnostic"
            exit $failureStatus
          }

      - name: Build native Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_log="$RUNNER_TEMP/linux-package.log"
          set +e
          ${{ matrix.package-command }} 2>&1 | tee "$package_log"
          pipeline_statuses=("${PIPESTATUS[@]}")
          build_status=${pipeline_statuses[0]}
          tee_status=${pipeline_statuses[1]}
          set -e

          failure_status=$build_status
          if ((failure_status == 0 && tee_status != 0)); then
            failure_status=$tee_status
          fi

          if ((failure_status != 0)); then
            diagnostic="$(
              printf 'Linux installer build failed (build exit %s, log capture exit %s). Last 200 log lines:\n' "$build_status" "$tee_status"
              if [[ -r "$package_log" ]]; then
                tail -n 200 "$package_log" || printf 'Unable to read the complete packaging log.\n'
              else
                printf 'Packaging log is unavailable.\n'
              fi
              :
            )"
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error::%s\n' "$diagnostic"
            exit "$failure_status"
          fi

      - name: Build native installer
        if: runner.os == 'Windows'
        run: ${{ matrix.package-command }}

      - name: Configure Linux sandbox permissions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox_path=dist/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%u:%g' "$sandbox_path")" = '0:0'
          test "$(stat -c '%a' "$sandbox_path")" = '4755'

      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          smoke_log="$RUNNER_TEMP/linux-smoke.log"
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pnpm smoke:linux 2>&1 | tee "$smoke_log"
          pipeline_statuses=("${PIPESTATUS[@]}")
          smoke_status=${pipeline_statuses[0]}
          tee_status=${pipeline_statuses[1]}
          set -e

          failure_status=$smoke_status
          if ((failure_status == 0 && tee_status != 0)); then
            failure_status=$tee_status
          fi

          if ((failure_status != 0)); then
            diagnostic="$(
              printf 'Linux packaged smoke failed (smoke exit %s, log capture exit %s). Last 200 log lines:\n' "$smoke_status" "$tee_status"
              if [[ -r "$smoke_log" ]]; then
                tail -n 200 "$smoke_log" || printf 'Unable to read the complete smoke log.\n'
              else
                printf 'Linux smoke log is unavailable.\n'
              fi
              :
            )"
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error::%s\n' "$diagnostic"
            exit "$failure_status"
          fi

      - name: Check packaged Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/check-windows-helper.ps1 dist/win-unpacked/resources/windows/window-helper.ps1

      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        run: pnpm smoke:win

      - name: Upload native installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
